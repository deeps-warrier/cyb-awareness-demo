<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<meta http-equiv="refresh" content="2">

<style>
table{
border-collapse:collapse;
width:100%;
}
td,th{
border:1px solid #ccc;
padding:8px;
}
</style>

</head>
<body>

<h1>Cyber Awareness Dashboard</h1>

<table>

<tr>
<th>Time</th>
<th>IP Address</th>
<th>Device</th>
<th>Browser</th>
<th>OS</th>
<th>Camera_Access</th>
</tr>

{% for row in rows %}

<tr>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[5] }}</td>
<td>{{ row[6] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
